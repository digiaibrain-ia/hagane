<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="app-version" content="0.7">
<title>Baggio — Sistema de filtragem</title>
<!--
  BAGGIO MONITOR v0.7  (SOMENTE LEITURA)
  HISTORICO
    v0.7  Setas geradas do tubo (mesmo sentido da animacao); afastamento padrao de 24 entre tubos; ponte no cruzamento;
          valvulas alinhadas ao eixo do tubo; sem sobreposicao de rotulos; simulador sem silencio.
    v0.6  Sem "Hagane" na tela; Dados: PLC | Simulados; tubo ligado ao tanque limpo; valvula quebra vacuo; Alertas e falhas
          no padrao do medidor (codigo, efeito, causa, solucao, como o PLC decide) a partir dos blocos do PLC.
    v0.5  Sem deslocamento de UI (aviso fixo no rodape, espaco reservado); tubo do extrator emendado no funil.
    v0.4  Nome Baggio (Hagane = fabrica); fonte CPU/Simulacao no proprio HTML; nivel dos tanques pelos sensores com
          animacao da agua (liga/desliga); 6 colisoes de texto corrigidas.
    v0.3  Dois visuais (Moderno = identidade do medidor; Original = WinCC); menos informacao repetida.
    v0.2  Overview fiel a tela do WinCC (Baggio - Sistema de agua); clique na lampada = detalhe.
    v0.1  Primeira versao: Overview, Alertas e falhas, Entradas e saidas.
  COMO FUNCIONA
    A pagina so le /baggio/api/estado (1 s) e /baggio/api/tags do Node-RED.
    Nao existe nenhum botao de comando. Se a leitura falha ou fica velha, a tela diz
    "SEM COMUNICACAO" e apaga os valores (nunca mostra valor velho como se fosse atual).
  ORGANIZACAO DO CODIGO (secoes neste arquivo)
    1. Config   2. Dados (API/estado)   3. Mapa (equipamentos)   4. Alarmes
    5. Overview 6. Alertas              7. E/S      8. Cabecalho/abas   9. Inicio
-->
<style>
:root{
  --bg:#e8ecef; --panel:#ffffff; --ink:#1b2a33; --muted:#586873; --line:#c8d1d7;
  --head:#0b4a5c; --head-ink:#ffffff;
  --run:#1c7f55; --run-bg:#dff2e8; --warn:#9a6700; --warn-bg:#fff1cc;
  --bad:#b3261e; --bad-bg:#fde3e1; --off:#7d8a93; --off-bg:#eef1f3;
  --liq:#5aa7c7; --sujo:#c9b24a; --focus:#0a64ad;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14px/1.35 var(--font);background:var(--bg);color:var(--ink);display:flex;flex-direction:column;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:1px}

/* ---- cabecalho ---- */
header{background:var(--head);color:var(--head-ink);display:flex;align-items:center;gap:12px;padding:8px 16px;flex-wrap:wrap}
header h1{font-size:17px;margin:0;font-weight:650;letter-spacing:.02em;flex:1 1 auto;white-space:nowrap}
header h1 small{font-weight:400;opacity:.8;margin-left:8px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 11px;font-weight:650;font-size:12.5px;border:2px solid transparent;white-space:nowrap}
.pill.real{background:#fff;color:#0b4a5c}
.pill.demo{background:#ffd23f;color:#3b2f00;border-color:#3b2f00;letter-spacing:.06em}
.pill.com-ok{background:var(--run-bg);color:var(--run)}
.pill.com-bad{background:var(--bad);color:#fff}
.pill.com-nd{background:var(--off-bg);color:var(--muted)}
#relogio{font-variant-numeric:tabular-nums;opacity:.9;font-size:13px}

/* ---- abas ---- */
nav{background:#fff;border-bottom:1px solid var(--line);display:flex;gap:2px;padding:0 10px;overflow-x:auto}
nav button{border:0;background:none;padding:11px 16px;font-weight:600;color:var(--muted);border-bottom:4px solid transparent;white-space:nowrap}
nav button[aria-selected="true"]{color:var(--head);border-bottom-color:var(--head)}
nav .cnt{display:inline-block;min-width:22px;text-align:center;margin-left:6px;border-radius:11px;padding:0 6px;background:var(--off-bg);color:var(--muted);font-size:12px}
nav .cnt.ativo{background:var(--bad);color:#fff}
nav .cnt.aviso{background:var(--warn);color:#fff}

/* ---- faixa de situacao (sempre visivel) ---- */
#faixa{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:6px 16px;background:#fff;border-bottom:1px solid var(--line);font-weight:600}
#faixa .luz{display:inline-flex;align-items:center;gap:6px}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--off);background:transparent;flex:none}
.dot.on-g{background:var(--run);border-color:var(--run)}
.dot.on-y{background:#e0a800;border-color:#9a6700}
.dot.on-r{background:var(--bad);border-color:var(--bad)}
.dot.nd{border-style:dashed}

/* ---- aviso de comunicacao ---- */
#aviso{display:none;background:var(--bad);color:#fff;padding:10px 16px;font-weight:700}
#aviso small{font-weight:400;display:block;opacity:.95}
body.sem-com #aviso{display:block}
body.sem-com .dados{filter:grayscale(1);opacity:.45}
#conf{display:none;background:var(--warn-bg);padding:10px 16px;border-bottom:1px solid var(--line)}
#conf input{font:inherit;padding:5px 8px;width:min(340px,70vw)}

header,nav,#faixa,#aviso,#conf{flex:none}   /* nao encolher no celular */
main{flex:1;padding:12px 16px 20px;min-width:0}
.vista{display:none}
.vista.ativa{display:block}
.barra{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.barra h2{margin:0;font-size:16px}
.info-btn{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--muted);background:#fff;color:var(--muted);font-weight:700;line-height:1}
.pop{position:fixed;z-index:30;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 28px rgba(0,0,0,.25);padding:14px 16px;max-width:min(460px,92vw);max-height:80vh;overflow:auto}
.pop h3{margin:0 0 8px;font-size:15px}
.pop .fechar{position:absolute;top:6px;right:8px;border:0;background:none;font-size:20px}
.pop p,.pop li{margin:.3em 0}

/* ---- overview ---- */
.ov{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:12px;align-items:start}
.painel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.painel h3{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.svgwrap{overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px}
#svg{display:block;width:100%;height:auto;max-height:calc(100vh - var(--alt-svg,170px));margin:0 auto}
.lin{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px dashed var(--line)}
.lin:last-child{border:0}
.lin .t{flex:1}
.lin .v{font-weight:700;font-size:12px;color:var(--muted)}
.lin.ativo .v{color:var(--run)}
.lin.ruim.ativo .v{color:var(--bad)}
/* svg: estados de equipamento */
.eq rect.f{fill:var(--off-bg);stroke:var(--off);stroke-width:1.5}
.eq.run rect.f{fill:var(--run-bg);stroke:var(--run);stroke-width:2.5}
.eq.fail rect.f{fill:var(--bad-bg);stroke:var(--bad);stroke-width:3}
.eq.nd rect.f{stroke-dasharray:5 3}
.eq text{font-family:var(--font);fill:var(--ink)}
.eq .n{font-size:12.5px;font-weight:650}
.eq .s{font-size:11.5px;font-weight:700;fill:var(--muted)}
.eq.run .s{fill:var(--run)}
.eq.fail .s{fill:var(--bad)}
.eq .ic{fill:none;stroke:var(--off);stroke-width:2}
.eq.run .ic{stroke:var(--run)}
.eq.fail .ic{stroke:var(--bad)}
.tubo{stroke:#9fb0ba;stroke-width:5;fill:none;stroke-linejoin:round}
.tubo.vivo{stroke:var(--liq)}
.tanque{fill:#fff;stroke:#52646e;stroke-width:2.5}
.nivel-l{fill:var(--liq);opacity:.75}
.nivel-s{fill:var(--sujo);opacity:.8}
.rot{font:11.5px var(--font);fill:var(--muted)}
.rot .b{font-weight:700}
.sen circle{fill:#fff;stroke:var(--off);stroke-width:2}
.sen.on circle{fill:var(--run);stroke:var(--run)}
.sen text{font:11px var(--font);fill:var(--ink)}
.vlv path{fill:#fff;stroke:var(--off);stroke-width:2}
.vlv.on path{fill:var(--run);stroke:var(--run)}
.vlv text{font:11px var(--font);fill:var(--ink)}
.vlv.nd path{stroke-dasharray:3 2}
.banda{fill:none;stroke:#6f7f89;stroke-width:3;stroke-dasharray:8 6}
.banda.gira{animation:desl 1.2s linear infinite}
@keyframes desl{to{stroke-dashoffset:-28}}
@media (prefers-reduced-motion:reduce){.banda.gira{animation:none}}

/* ---- overview fiel ao WinCC (v0.2) ---- */
.tela{background:#d5d9dc;border:1px solid #9aa3a8}
.tela-tit{background:#0d4a5e;color:#fff;font:700 15px Tahoma,Arial,sans-serif;padding:6px 14px;display:flex;align-items:center;gap:10px;letter-spacing:.02em}
.tela-tit .info-btn{background:transparent;color:#fff;border-color:#fff}
.tela .svgwrap{border:0;border-radius:0;background:transparent}
#svg text{font-family:Tahoma,Arial,sans-serif}
.rt{font-size:10px;font-weight:700;fill:#1b2a33}
.rt2{font-size:12px;fill:#1b2a33}
.rt3{font-size:13.5px;fill:#1b2a33}
.seta{font-size:14px;fill:#1b2a33}
.eqp{fill:#cfd3d6;stroke:#6f7a80;stroke-width:1.5}
.eqp2{fill:#b3b9bd;stroke:#6f7a80;stroke-width:1.5}
.pnl{fill:#c3c8cc;stroke:#9aa3a8}
.tb-o{fill:none;stroke:#2b9a43;stroke-width:9;stroke-linejoin:round;stroke-linecap:round}
.tb-i{fill:none;stroke:#7be884;stroke-width:5;stroke-linejoin:round;stroke-linecap:round}
.tb-o.ar{stroke:#2c5cb5}.tb-i.ar{stroke:#7aa6f2}
.tb-ponta{fill:#7be884;stroke:#2b9a43;stroke-width:2.5}
.lp{cursor:pointer}
.lp circle{fill:url(#gOff);stroke:#59646a;stroke-width:1}
.lp.on circle{fill:url(#gOn);stroke:#0f6a2c}
.lp.fail circle{fill:url(#gFail);stroke:#7d120c}
.lp.nd circle{fill:#e4e7e9;stroke-dasharray:2 2}
.lpx{font:700 11px Arial,sans-serif;fill:#fff;pointer-events:none}
.lp.nd .lpx{fill:#59646a}
.vl{cursor:pointer}
.vl path{fill:#eef0f1;stroke:#59646a;stroke-width:1.3}
.vl.on path{fill:#35c75a;stroke:#0f6a2c}
.vl.nd path{stroke-dasharray:2 2}
.hz{fill:#fff;stroke:#8d969c}
.hzt{font-size:12px;fill:#1b2a33}
@media (max-width:900px){ #svg{min-width:900px} }

/* ---- alertas ---- */
table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:#f3f6f8;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
tr.ativo td{background:var(--bad-bg)}
tr.ativo.sev-alarme td{background:var(--warn-bg)}
tr.inativo td{color:var(--muted)}
.sev{display:inline-block;padding:1px 8px;border-radius:4px;font-size:12px;font-weight:700;border:1.5px solid currentColor;white-space:nowrap}
.sev.emergencia{color:#fff;background:var(--bad);border-color:var(--bad)}
.sev.critico{color:var(--bad)}
.sev.alarme{color:var(--warn)}
.sev.campo{color:var(--muted)}
.vazio{padding:26px;text-align:center;background:var(--panel);border:1px dashed var(--line);border-radius:8px;color:var(--run);font-weight:700;font-size:16px}
.tw{overflow-x:auto}
label.chk{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.btn{border:1.5px solid var(--head);background:#fff;color:var(--head);border-radius:6px;padding:5px 12px;font-weight:600}
.btn:hover{background:#eef6f8}
h3.sec{margin:18px 0 8px;font-size:14px}

/* ---- e/s ---- */
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.byte{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.byte h4{margin:0 0 6px;font-size:13px;color:var(--head)}
.bit{display:flex;gap:8px;align-items:flex-start;padding:3px 0}
.bit .a{font-family:ui-monospace,Consolas,monospace;font-size:12.5px;width:46px;flex:none;color:var(--muted)}
.bit .d{flex:1;font-size:13px}
.bit .d small{color:var(--muted);display:block;font-size:11px}
.bit .e{font-size:11px;font-weight:700;width:34px;text-align:right;flex:none}
.bit.on .e{color:var(--run)}
.bit.nd .e{color:var(--off)}
.warn{color:var(--warn);font-weight:700}
input[type=search]{font:inherit;padding:6px 10px;border:1.5px solid var(--line);border-radius:6px;min-width:200px}
.sub{display:flex;gap:6px}
.sub button{border:1.5px solid var(--line);background:#fff;border-radius:6px;padding:5px 14px;font-weight:600}
.sub button[aria-pressed="true"]{background:var(--head);color:#fff;border-color:var(--head)}

@media (max-width:900px){
  .ov{grid-template-columns:1fr}
  header{padding:6px 12px;gap:6px}
  header h1{font-size:15px;flex-basis:100%}
  header h1 small{display:none}
  .pill{font-size:12px;padding:2px 9px}
  main{padding:8px 10px 16px}
  th.h-origem,td.h-origem{display:none}
}

/* ============ v0.3 · cabecalho: selo de estado e chave de visual ============ */
.pill.st-run{background:var(--run-bg);color:var(--run)}
.pill.st-warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}
.pill.st-bad{background:var(--bad);color:#fff}
.pill.st-off,.pill.st-nd{background:var(--off-bg);color:var(--muted)}
.vis{display:inline-flex;border:1.5px solid rgba(255,255,255,.55);border-radius:7px;overflow:hidden}
.vis button{border:0;background:transparent;color:#fff;padding:3px 11px;font-weight:600;font-size:12.5px}
.vis button[aria-pressed="true"]{background:#fff;color:var(--head)}
.tela{position:relative}
.info-flut{display:none;position:absolute;top:8px;right:8px;z-index:2}
body.tema-ori #site{display:none}               /* no Original o local ja aparece na barra do WinCC */

/* ============ v0.3 · visual MODERNO (identidade do medidor) ============ */
body.tema-mod{
  --bg:#f3f5f8; --panel:#ffffff; --ink:#141414; --muted:#5b6b7e; --line:#dde2e8;
  --head:#1a4a78; --acento:#ec7000;
  --run:#1f7a4d; --run-bg:#e3f3ea; --warn:#b45f00; --warn-bg:#fff0dc;
  --bad:#c62828; --bad-bg:#fde8e8; --off:#8a98a8; --off-bg:#eef1f5; --focus:#1a4a78;
  --font:system-ui,"Segoe UI",Roboto,Arial,sans-serif;
  --alt-svg:140px;
}
body.tema-mod nav button[aria-selected="true"]{color:var(--head);border-bottom-color:var(--acento)}
body.tema-mod .tela-tit{display:none}
body.tema-mod .info-flut{display:inline-block}
body.tema-mod .tela{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
body.tema-mod #svg text{font-family:var(--font)}
body.tema-mod .cv{fill:var(--panel)}
body.tema-mod .cvp{display:none}
body.tema-mod .eqp{fill:#eef1f5;stroke:#8a98a8;stroke-width:1.5}
body.tema-mod .eqp2{fill:#dfe5ec;stroke:#8a98a8;stroke-width:1.5}
body.tema-mod .pnl{fill:#f3f5f8;stroke:var(--line)}
body.tema-mod .tb-i{display:none}
body.tema-mod .tb-o{stroke:#3d86b8;stroke-width:4.5}
body.tema-mod .tb-o.ar{stroke:#1a4a78}
body.tema-mod .tb-ponta{fill:#3d86b8;stroke:none}
body.tema-mod .liq{fill:#f2c94c;opacity:.9}
body.tema-mod .seg{stroke:var(--acento);stroke-width:1.2;stroke-dasharray:4 4}
body.tema-mod .rt,body.tema-mod .rt2,body.tema-mod .rt3,body.tema-mod .seta{fill:var(--ink)}
body.tema-mod .rt{font-size:10.5px;font-weight:600}
body.tema-mod .lp circle{fill:#d3dae2;stroke:#8a98a8;stroke-width:1.5}
body.tema-mod .lp.on circle{fill:var(--run);stroke:var(--run)}
body.tema-mod .lp.fail circle{fill:var(--bad);stroke:var(--bad)}
body.tema-mod .lp.nd circle{fill:var(--panel);stroke:var(--off)}
body.tema-mod .vl path{fill:var(--panel);stroke:var(--muted);stroke-width:1.5}
body.tema-mod .vl.on path{fill:var(--run);stroke:var(--run)}
body.tema-mod .hz{fill:var(--panel);stroke:var(--line)}
body.tema-mod .hzt{fill:var(--muted)}

/* ============ v0.3 · MODERNO no escuro (como o medidor: segue o sistema) ============ */
@media (prefers-color-scheme:dark){
  body.tema-mod{
    --bg:#10161d; --panel:#18212b; --ink:#e8edf2; --muted:#93a3b5; --line:#2a3744; --head:#0f2e4d;
    --run:#4cc38a; --run-bg:#143025; --warn:#f2a54a; --warn-bg:#352612;
    --bad:#cf4242; --bad-bg:#3a1a1a; --off:#6c7c8e; --off-bg:#1f2933; --focus:#7fb4ea;
  }
  body.tema-mod nav,body.tema-mod table,body.tema-mod .pop,body.tema-mod .byte,body.tema-mod .painel{background:var(--panel)}
  body.tema-mod th{background:#1f2933}
  body.tema-mod .btn,body.tema-mod .info-btn,body.tema-mod input[type=search],body.tema-mod .sub button,body.tema-mod #conf input{background:var(--panel);color:var(--ink)}
  body.tema-mod .sub button[aria-pressed="true"]{background:#2a5d94;color:#fff}
  body.tema-mod .pill.real{background:#e8edf2;color:#0f2e4d}
  body.tema-mod nav button[aria-selected="true"]{color:#fff}
  body.tema-mod .eqp{fill:#222e3a;stroke:#6c7c8e}
  body.tema-mod .eqp2{fill:#2a3745;stroke:#6c7c8e}
  body.tema-mod .pnl{fill:#1f2933}
  body.tema-mod .tb-o{stroke:#4f9ccf}
  body.tema-mod .tb-o.ar{stroke:#7fb4ea}
  body.tema-mod .tb-ponta{fill:#4f9ccf}
  body.tema-mod .liq{fill:#b8932a}
  body.tema-mod .lp circle{fill:#3a4756;stroke:#6c7c8e}
  body.tema-mod .lp.on circle{stroke:var(--run)}
  body.tema-mod .vl path{fill:#18212b}
  body.tema-mod tr.ativo td{color:var(--ink)}
}

/* ============ v0.4 · marca/fabrica, animacao, liquidos ============ */
body.tema-mod .h-fab{display:none}
body.tema-ori .h-marca{display:none}
.anim-sw{position:absolute;top:6px;right:12px;z-index:2;display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:12.5px;color:#fff;cursor:pointer}
body.tema-mod .anim-sw{right:46px;top:9px;color:var(--ink)}
.anim-sw input{width:16px;height:16px;accent-color:var(--acento,#ec7000)}
.liqg{transition:none}
.liq{fill:#ecea00}                                  /* Original: amarelo do WinCC */
.liqL{fill:#7ec8e8;opacity:.8}
.liq2{opacity:.55;fill:#fff3a0}
body.tema-mod .liq2{fill:#ffe9a0}
body.tema-mod .liqL{fill:#6fb3dc;opacity:.85}
.tb-f{fill:none;stroke:#fff;stroke-opacity:.9;stroke-width:2.4;stroke-linecap:round;stroke-dasharray:1 13;display:none}
body.anim .tb-f.vivo{display:inline}
body.anim .tb-f.vivo{animation:fluxo .9s linear infinite}
body.anim .tb-f.vivo.rev{animation-direction:reverse}
@keyframes fluxo{to{stroke-dashoffset:-14}}
body.anim .liqg{transition:transform 1.8s ease-in-out}
body.anim .ondas{animation:onda 5s linear infinite}
body.anim .ondas2{animation-duration:8s;animation-direction:reverse}
@keyframes onda{to{transform:translateX(-46px)}}
body.anim .ondas2{animation-name:onda2}
@keyframes onda2{to{transform:translateX(-70px)}}
body.anim .ondasL{animation-name:ondaL;animation-duration:4s}
@keyframes ondaL{to{transform:translateX(-40px)}}
@media (max-width:900px){ .anim-sw{top:6px} }
@media (prefers-color-scheme:dark){ body.tema-mod .anim-sw{color:var(--ink)} body.tema-mod .liqL{fill:#4f9ccf} }

/* ============ v0.5 · sem deslocamento de UI ============ */
html{scrollbar-gutter:stable}
main{padding-bottom:44px}                                   /* reserva fixa para a faixa do rodape: nunca empurra nem cobre */
#aviso{position:fixed;left:0;right:0;bottom:0;z-index:25;padding:8px 16px;font-size:14px;box-shadow:0 -2px 10px rgba(0,0,0,.3)}
#aviso small{display:inline;margin-left:10px;font-weight:400}
#pEstado,#pCom,#pOrigem{justify-content:center;text-align:center}
#pEstado{min-width:128px}
#pCom{min-width:166px}
#pOrigem{min-width:172px}
.cnt{min-width:24px}
body{--alt-svg:194px}                                         /* desenho cabe na tela com a reserva do rodape */
body.tema-mod{--alt-svg:164px}

/* ============ v0.6 · cabecalho e valvula ============ */
.vis-rot{color:#fff;font-size:12.5px;font-weight:600;opacity:.9}
.vl-at{fill:#c3c8cc;stroke:#59646a;stroke-width:1}
body.tema-mod .vl-at{fill:var(--off-bg);stroke:var(--muted)}
body.tema-mod .vl.on .vl-at{fill:#bfe6cf}

/* ============ v0.6 · alertas e falhas (padrao do medidor: efeito -> causa -> solucao) ============ */
.menu-wrap{position:relative;margin-left:auto}
.menu{position:absolute;right:0;top:calc(100% + 4px);z-index:30;min-width:270px;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.25);padding:4px}
.menu[hidden]{display:none}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 12px;border-radius:6px;font-weight:600}
.menu button:hover,.menu button:focus-visible{background:var(--off-bg)}
.al-hist-bar{margin-top:6px}
.al-hist-bar .sec{margin:12px 0 0}
.al-hist-bar .btn{margin-top:12px}
.al-tab .al-lin{cursor:pointer}
.al-tab .al-lin:hover td{filter:brightness(.97)}
.al-tab .seta-c{width:26px;color:var(--muted);text-align:center}
.cod{font-family:ui-monospace,Consolas,monospace;font-weight:700;white-space:nowrap}
.tp{display:inline-block;padding:1px 9px;border-radius:4px;font-size:12px;font-weight:700;white-space:nowrap}
.tp-F.tp{background:var(--bad);color:#fff}
.tp-A.tp{border:1.5px solid var(--warn);color:var(--warn)}
.tp-I.tp{border:1.5px solid var(--off);color:var(--muted)}
tr.ativo.tp-F td{background:var(--bad-bg)}
tr.ativo.tp-A td{background:var(--warn-bg)}
tr.ativo.tp-I td{background:var(--off-bg)}
tr.al-det td{padding:0;background:var(--panel);border-bottom:2px solid var(--line)}
.corpo{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px 22px;padding:14px 18px 16px;max-width:1400px}
.corpo h4{margin:0 0 6px;font-size:14px}
.corpo p,.corpo ol,.corpo ul{margin:.3em 0}
.corpo ol{padding-left:20px}
.corpo ul.sol{list-style:none;padding:0}
.corpo ul.sol li{margin:6px 0}
.onde{display:inline-block;font-size:11.5px;font-weight:700;border:1.5px solid var(--line);border-radius:4px;padding:0 6px;margin-right:6px;color:var(--muted);white-space:nowrap}
.corpo .plc{grid-column:1/-1;border-top:1px dashed var(--line);padding-top:10px;margin-top:6px}
.plc dl{display:grid;grid-template-columns:110px minmax(0,1fr);gap:4px 12px;margin:6px 0}
.plc dt{color:var(--muted);font-weight:600}
.plc dd{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;gap:6px;align-items:center;border:1.5px solid var(--line);border-radius:6px;padding:0 8px;font-family:ui-monospace,Consolas,monospace;font-size:12.5px}
.chip.on{border-color:var(--run);color:var(--run);background:var(--run-bg)}
.chip.nd{border-style:dashed;color:var(--muted)}
.obs{background:var(--warn-bg);border-left:4px solid var(--warn);padding:6px 10px;border-radius:4px}
.peq{font-size:12px}
@media (max-width:1000px){ .corpo{grid-template-columns:1fr} .plc dl{grid-template-columns:90px minmax(0,1fr)} }
@media print{
  body *{visibility:hidden}
  #v-al,#v-al *{visibility:visible}
  #v-al{position:absolute;left:0;top:0;width:100%}
  .barra,.al-hist-bar,#alHist,.tw{display:none!important}
  #aviso{display:none!important}
}

/* ============ v0.7 · tubulacao: setas, ponte, valvula ============ */
body{--cvc:#d5d9dc}
body.tema-mod{--cvc:var(--panel)}
.seta-ch{fill:none;stroke:var(--ink);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
body.tema-mod .seta-ch{stroke:var(--muted)}
.tb-halo{fill:none;stroke:var(--cvc);stroke-width:15;stroke-linecap:butt}
.vl-fl,.vl-hs{fill:none;stroke:#59646a;stroke-width:1.6;stroke-linecap:round}
body.tema-mod .vl-fl,body.tema-mod .vl-hs{stroke:var(--muted)}
.vl.on .vl-fl,.vl.on .vl-hs{stroke:#0f6a2c}
.vl-at{stroke-width:1.2}
</style>
</head>

// [F] Ciclo de 180 s: 40-70 s aviso (permissivel); 100-140 s falha critica na bomba 1; 150-165 s silencio.
// [F] Nivel do tanque sujo sobe e desce a cada 60 s e e entregue pelos SENSORES (sensor ativo = coberto):
// [F]   I6.1 minimo >= 15 %, I6.2 inicio de enchimento >= 40 %, I6.3 fim de enchimento >= 70 %, I6.0 maximo >= 90 %.
// [F] Tanque limpo (compensacao) oscila a cada 90 s: I6.5 minimo >= 15 %, I6.4 maximo >= 85 %.
// [F] Nunca usar em producao: a tela exibe "DEMO" em destaque (licao Demo x Real).
function simularBytes(contrato, agoraMs) {
  var t = (agoraMs / 1000) % 180;
  if (t >= 150 && t < 165) return null;
  var B = {};
  var set = function (end, v) {
    var m = /^([IQM])(\d+)\.(\d)$/.exec(end); if (!m) return;
    var k = m[1] + "B" + m[2]; B[k] = (B[k] || 0);
    if (v) B[k] |= (1 << Number(m[3])); else B[k] &= ~(1 << Number(m[3]));
  };
  contrato.tags.forEach(function (tg) { if (tg.bit && B[tg.byte] === undefined) B[tg.byte] = 0; });

  var falhaBomba1 = t >= 100 && t < 140, aviso = t >= 40 && t < 70;
  var fase = (t % 60) / 60, nivel = fase < 0.5 ? fase * 2 : 2 - fase * 2;          // tanque sujo 0..1
  var nl = 0.55 + 0.35 * Math.sin(2 * Math.PI * t / 90);                           // tanque limpo 0..1
  var limpeza = (t % 90) >= 20 && (t % 90) < 50;

  // base: comando, seguranca, disjuntores OK, ar, modo automatico
  ["I0.0","I0.3","I0.6","I4.2","I4.4","I5.0","I5.2","I5.4","I5.6","I1.0","I1.4","I2.0","I2.2","I2.4","I3.0","I3.5","Q12.1","Q12.2"].forEach(function (a) { set(a, true); });
  // sensores de nivel do tanque sujo (entradas) e lampadas do sinotico (saidas)
  set("I6.1", nivel >= 0.15); set("I6.2", nivel >= 0.40); set("I6.3", nivel >= 0.70); set("I6.0", nivel >= 0.90);
  set("Q14.6", nivel >= 0.90); set("Q14.7", nivel >= 0.70); set("Q15.0", nivel < 0.40); set("Q15.1", nivel < 0.15);
  // tanque limpo
  set("I6.5", nl >= 0.15); set("I6.4", nl >= 0.85); set("Q14.4", nl >= 0.85); set("Q14.5", nl < 0.15);
  // bombas
  var b1 = !falhaBomba1, b2 = nivel > 0.5;
  set("I1.1", b1); set("I1.2", b1); set("Q13.0", b1);
  set("I1.5", b2); set("I1.6", b2); set("Q13.1", b2);
  set("I2.1", true); set("Q13.6", true);
  // ciclo de autolimpeza
  set("Q12.4", limpeza);
  set("I2.3", limpeza); set("Q13.4", limpeza); set("Q14.1", limpeza); set("Q14.3", limpeza);
  set("I3.1", limpeza); set("Q13.5", limpeza);
  set("I3.6", true); set("Q13.2", true); set("I2.5", true); set("Q13.3", true);
  set("Q15.3", true); set("Q15.4", true); set("Q14.0", true); set("Q15.6", b2); set("Q14.2", nl > 0.5);
  // coluna sinaleira
  set("Q11.4", !falhaBomba1);
  if (aviso) { set("M13.7", true); set("M21.3", true); set("Q11.6", true); }
  if (falhaBomba1) { set("M12.2", true); set("M122.2", true); set("M21.0", true); set("Q11.5", true); set("Q11.7", true); }
  return B;
}

const Dados = {
  base: "", contrato: null, tagsPorEnd: {}, estado: null,
  ultimoOk: 0, falhas: 0, semCom: true, motivo: "aguardando 1ª leitura", semDesde: Date.now(),
  ouvintes: [],
  bit(a){ if (this.semCom || !this.estado) return undefined; const v=this.estado.bits[a]; return v===undefined?undefined:v; },
  tag(a){ return this.tagsPorEnd[a]; },
  aoAtualizar(f){ this.ouvintes.push(f); },
  async buscar(url){
    const c = new AbortController(); const t = setTimeout(()=>c.abort(), 3000);
    try { const r = await fetch(this.base+url,{cache:"no-store",signal:c.signal}); if(!r.ok) throw new Error("HTTP "+r.status); return await r.json(); }
    finally { clearTimeout(t); }
  },
  async carregarContrato(){
    this.contrato = await this.buscar("/baggio/api/tags");
    this.tagsPorEnd = {}; this.contrato.tags.forEach(t=>this.tagsPorEnd[t.endereco]=t);
  },
  fonte: "cpu", simUltimo: null,
  /* SIMULACAO: gera o estado no proprio navegador (mesmo codigo do fluxo demo). Nada de rede. */
  lerSim(){
    if (!this.contrato) { this.contrato = CONTRATO_EMB; this.tagsPorEnd = {}; CONTRATO_EMB.tags.forEach(t=>this.tagsPorEnd[t.endereco]=t); }
    const B = simularBytes(CONTRATO_EMB, Date.now());
    if (B) { const bits = {}; CONTRATO_EMB.tags.forEach(t=>{ const v=B[t.byte]; if (typeof v==="number") bits[t.endereco]=((v>>t.nbit)&1)===1; }); this.simUltimo = {ts:Date.now(), bits}; }
    const u = this.simUltimo, idade = u ? Date.now()-u.ts : null, ok = !!u && idade <= Cfg.velhoMs;
    this.falhas = 0;
    this.estado = {versao:VERSAO, origem:"demo", agora:Date.now(), ts:u&&u.ts, idade_ms:idade, comunicacao: ok?"ok":"sem_comunicacao", motivo: ok?"":"simulador em silêncio (teste de queda)", bits: u?u.bits:{}};
    this.definirCom(!ok, ok ? "" : this.estado.motivo);
    if (ok) this.ultimoOk = Date.now();
  },
  /* troca de fonte em funcionamento: zera o que veio da fonte anterior */
  trocarFonte(f){
    this.fonte = f; this.contrato = null; this.estado = null; this.tagsPorEnd = {}; this.simUltimo = null;
    this.falhas = 0; this.semCom = true; this.motivo = "aguardando 1ª leitura"; this.semDesde = Date.now();
    Alarmes.defs = []; Alarmes.estado = {}; Alarmes.iniciado = false; TelaES.montadoAnalog = false;
    gravarStorage("baggio_fonte", f);
    $$("#fonteSel button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.fonte===f));
    this.ler();
  },
  async ler(){
    if (this.fonte === "sim") { this.lerSim(); this.ouvintes.forEach(f=>{ try{ f(); }catch(e){ console.error(e); } }); return; }
    const f0 = this.fonte;                 // fonte no inicio desta leitura
    try {
      if (!this.contrato) await this.carregarContrato();
      if (this.fonte !== f0) { this.contrato = null; return; }          // trocou de fonte durante a espera: descarta
      const e = await this.buscar("/baggio/api/estado");
      if (this.fonte !== f0) return;                                     // idem: resposta velha de outra fonte
      this.falhas = 0; this.estado = e;
      const ok = e.comunicacao === "ok" && e.idade_ms != null && e.idade_ms <= Cfg.velhoMs;
      this.definirCom(!ok, ok ? "" : (e.motivo || "dados velhos"));
      if (ok) this.ultimoOk = Date.now();
    } catch (err) {
      if (this.fonte !== f0) return;                                     // erro de uma fonte que ja foi trocada
      this.falhas++;
      if (this.falhas >= Cfg.falhasParaCair) this.definirCom(true, "Node-RED não responde ("+(err.message||err)+")");
    }
    this.ouvintes.forEach(f=>{ try{ f(); }catch(e){ console.error(e); } });
  },
  definirCom(sem, motivo){
    if (sem && !this.semCom) this.semDesde = Date.now();
    this.semCom = sem; this.motivo = motivo;
  },
  iniciar(){ this.ler(); setInterval(()=>this.ler(), Cfg.pollMs); }
};

const CHAVE_HIST = "baggio_alertasHist_v1";
const Alarmes = {
  defs: [], estado: {}, hist: [], iniciado: false,
  montar(){
    this.defs = CAT_ALARMES.alarmes.filter(a=>Dados.tag(a.bit));          // so o que existe no contrato lido
    const salvo = lerStorage(CHAVE_HIST);
    if (salvo) { try { this.hist = JSON.parse(salvo)||[]; } catch(e){} }
  },
  ativo(d){ const v = Dados.bit(d.bit); return v===undefined ? undefined : v===true; },
  ativos(){ return this.defs.filter(d=>d.tipo!=="I" && this.ativo(d)===true); },   // informacoes (I) nao contam como alarme
  atualizar(){
    if (!Dados.contrato) return;
    if (!this.defs.length) this.montar();
    if (Dados.semCom) return;                       // sem dado atual: nao registra transicoes
    const agora = Date.now(); let mudou = false;
    const origem = Dados.estado && Dados.estado.origem==="demo" ? "simulados" : "PLC";
    this.defs.forEach(d=>{
      const a = this.ativo(d); if (a===undefined) return;
      const e = this.estado[d.codigo];
      if (a && (!e || !e.ativo)) {
        this.estado[d.codigo] = {ativo:true, desde:agora, aoAbrir:!this.iniciado};
        if (d.tipo!=="I") { this.hist.push({t:agora, ev:this.iniciado?"ATIVOU":"JÁ ATIVO AO ABRIR", cod:d.codigo, end:d.bit, txt:d.nome, dados:origem, dur:""}); mudou = true; }
      } else if (!a && e && e.ativo) {
        if (d.tipo!=="I") { this.hist.push({t:agora, ev:"NORMALIZOU", cod:d.codigo, end:d.bit, txt:d.nome, dados:origem, dur:dur(agora-e.desde)}); mudou = true; }
        this.estado[d.codigo] = {ativo:false, desde:agora};
      } else if (!e) this.estado[d.codigo] = {ativo:false, desde:agora};
    });
    this.iniciado = true;
    if (mudou) { if (this.hist.length > 500) this.hist = this.hist.slice(-500); gravarStorage(CHAVE_HIST, JSON.stringify(this.hist)); }
  }
};

const Overview = {
  montado:false,
  /* estado de um equipamento: run / stop / fail / nd (sem dado) */
  estadoEq(id){
    const e = Mapa.eq[id];
    if (Dados.semCom) return {k:"nd", t:"SEM DADO"};
    const run = Dados.bit(e.run), disj = e.disj?Dados.bit(e.disj):true;
    const falhas = (e.falha||[]).filter(a=>Dados.bit(a)===true);
    if (falhas.length) { const tg = Dados.tag(falhas[0]); return {k:"fail", t:"FALHA", d: tg ? tg.comentario||tg.nome : falhas[0], end:falhas[0]}; }
    if (disj===false) return {k:"fail", t:"FALHA", d:"Disjuntor não OK", end:e.disj};
    if (run===undefined) return {k:"nd", t:"SEM DADO"};
    return run ? {k:"run", t:"EM OPERAÇÃO"} : {k:"stop", t:"PARADO"};
  },
  /* estado de uma lampada do desenho -> classe on / off / fail / nd + texto */
  estadoLampada(l){
    if (Dados.semCom) return {c:"nd", t:"sem dado", end:l.bit||Mapa.eq[l.eq].run};
    if (l.eq) {
      const r = this.estadoEq(l.eq), e = Mapa.eq[l.eq];
      return {c:{run:"on",stop:"off",fail:"fail",nd:"nd"}[r.k], t:r.t+(r.d?": "+r.d:""),
              end:"retorno "+e.run+(r.end?" · falha "+r.end:"")};
    }
    const v = Dados.bit(l.bit);
    return {c: v===undefined?"nd": v?"on":"off", t: v===undefined?"sem dado": v?"ATIVO (1)":"inativo (0)", end:l.bit};
  },
  lampada(id,x,y){ return `<g class="lp nd" data-lp="${id}" transform="translate(${x},${y})"><title></title><circle r="8"/><text class="lpx" y="4" text-anchor="middle"></text></g>`; },
  /* valvula no eixo do tubo: duas pontas de triangulo ao longo do tubo, flanges nas extremidades e atuador
     SEMPRE do mesmo lado (direita no tubo vertical, acima no horizontal), ligado por haste */
  valvula(v){
    const V = v.vert;
    const corpo = V ? "M-7 -9 L7 -9 L-7 9 L7 9 Z" : "M-9 -7 L-9 7 L9 -7 L9 7 Z";
    const flange = V ? "M-8 -10 H8 M-8 10 H8" : "M-10 -8 V8 M10 -8 V8";
    const haste = V ? "M7 0 H13" : "M0 -7 V-13";
    const at = V ? {x:13,y:-4,w:8,h:8} : {x:-4,y:-21,w:8,h:8};
    return `<g class="vl nd" data-vl="${v.id}" data-eixo="${V?"v":"h"}" transform="translate(${v.x},${v.y})"><title></title>

  },
  /* tubo: contorno + miolo; com "flux" ganha o traco de fluxo (so aparece com Animacao ligada e equipamento ativo) */
  tubo(d,cls,flux,rev,seta){ return `<path class="tb-o ${cls||""}" d="${d}" data-seta="${seta||0}" data-rev="${rev?1:0}"/><path class="tb-i ${cls||""}" d="${d}"/>`+(flux?`<path class="tb-f${rev?" rev":""}" data-flux="${flux}" d="${d}"/>`:""); },
  /* SETAS DE SENTIDO: geradas do proprio tubo (a animacao usa o mesmo caminho, entao nunca divergem).
     Ficam a 12 unidades do eixo, em trecho reto, longe de curvas, valvulas, instrumentos, lampadas, textos e outros tubos. */
  setas(){
    const svg = $("#svg"), NS = "http://www.w3.org/2000/svg", grp = $("#setas"); grp.innerHTML = "";
    const tubos = Array.from(svg.querySelectorAll(".tb-o"));
    const pts = tubos.map(p=>{ const L=p.getTotalLength(), a=[]; for (let s=0;s<=L;s+=5) a.push(p.getPointAtLength(s)); return a; });
    const caixa = el => { const b = el.getBBox(), m = /translate\(([-\d.]+),([-\d.]+)\)/.exec(el.getAttribute("transform")||""); return {x:b.x+(m?+m[1]:0), y:b.y+(m?+m[2]:0), w:b.width, h:b.height}; };
    const obst = Array.from(svg.querySelectorAll("[data-vl],.inst,[data-lp],.bmb,:scope > text")).map(caixa);
    const bate = (x,y,m) => obst.some(o => x > o.x-m && x < o.x+o.w+m && y > o.y-m && y < o.y+o.h+m);
    tubos.forEach((p,pi)=>{
      const lado = +p.dataset.seta; if (!lado) return;
      const rev = p.dataset.rev==="1", L = p.getTotalLength(), n = Math.max(1, Math.round(L/170));
      for (let i=0;i<n;i++){
        const alvo = L*(i+0.5)/n; let feito = false;
        for (const d of [0,14,-14,28,-28,42,-42,56,-56,70,-70]){
          const s = alvo+d; if (s < 26 || s > L-26) continue;
          const P = p.getPointAtLength(s), A = p.getPointAtLength(s-3), B = p.getPointAtLength(s+3);
          let ux = B.x-A.x, uy = B.y-A.y; const tl = Math.hypot(ux,uy); ux/=tl; uy/=tl;
          const tg = q=>{ const a=p.getPointAtLength(q-2), b=p.getPointAtLength(q+2), l=Math.hypot(b.x-a.x,b.y-a.y); return [(b.x-a.x)/l,(b.y-a.y)/l]; };
          const T1 = tg(s-16), T2 = tg(s+16);
          if (T1[0]*T2[0]+T1[1]*T2[1] < 0.999 || T1[0]*ux+T1[1]*uy < 0.999) continue;    // so em trecho reto (sem curva na janela de 32)
          const cx = P.x - uy*lado*12, cy = P.y + ux*lado*12;
          if (bate(cx,cy,8)) continue;
          if (pts.some((a,qi)=>qi!==pi && a.some(q=>Math.hypot(q.x-cx,q.y-cy) < 14))) continue;   // longe de outros tubos
          let ang = Math.atan2(uy,ux)*180/Math.PI + (rev?180:0);
          const ch = document.createElementNS(NS,"path"); ch.setAttribute("class","seta-ch"); ch.setAttribute("d","M-3.5 -4 L2.5 0 L-3.5 4");
          ch.setAttribute("transform",`translate(${cx.toFixed(1)},${cy.toFixed(1)}) rotate(${ang.toFixed(1)})`);
          ch.dataset.tubo = pi; ch.dataset.dir = rev?"rev":"fwd"; grp.appendChild(ch); feito = true; break;
        }
      }
    });
  },
  /* superficie da agua: onda que se repete a cada "per"; o grupo anda 1 periodo em loop (CSS) */
  onda(x0,larg,per,amp,fundo){
    let d = `M${x0-per} 0`; const n = Math.ceil((larg+2*per)/per);

        return `<tr class="al-lin ${a?"ativo":"inativo"} tp-${d.tipo}" data-cod="${esc(d.codigo)}" tabindex="0" role="button" aria-expanded="${ab}">
          <td class="seta-c">${ab?"▾":"▸"}</td><td><span class="cod">${esc(d.codigo)}</span></td>
          <td><span class="tp tp-${d.tipo}">${this.NOME[d.tipo]}</span></td><td>${esc(d.nome)}</td>${mostraEst?`<td>${est}</td>`:""}
          <td class="num" data-ini="${esc(d.codigo)}"></td><td class="num" data-dur="${esc(d.codigo)}"></td></tr>`+
          (ab?`<tr class="al-det"><td colspan="${mostraEst?7:6}">${this.det(d)}</td></tr>`:"");
      }).join("")+"</tbody></table>";
  },
  /* partes que mudam a cada segundo sem refazer a lista (mantem selecao de texto e painel aberto) */
  vivo(){
    const agora = Date.now();
    $$("#alLista [data-ini]").forEach(td=>{ const e = Alarmes.estado[td.dataset.ini], d = Alarmes.defs.find(x=>x.codigo===td.dataset.ini);
      const a = d && Alarmes.ativo(d)===true; td.textContent = a&&e ? hhmmss(e.desde)+(e.aoAbrir?" (ao abrir)":"") : "—"; });
    $$("#alLista [data-dur]").forEach(td=>{ const e = Alarmes.estado[td.dataset.dur], d = Alarmes.defs.find(x=>x.codigo===td.dataset.dur);
      const a = d && Alarmes.ativo(d)===true; td.textContent = a&&e ? dur(agora-e.desde) : "—"; });
    $$("#alLista .chip").forEach(c=>{ const v = Dados.bit(c.dataset.end); c.classList.toggle("on", v===true); c.classList.toggle("nd", v===undefined);
      $("b",c).textContent = v===undefined ? "—" : v ? "1" : "0"; });
  },
  atualizar(){
    if (!Alarmes.defs.length) { $("#alLista").innerHTML = '<div class="vazio" style="color:var(--muted)">Carregando…</div>'; this.assin=""; }
    else {
      const L = this.lista();
      const sig = [this.vista, this.busca, Dados.semCom?1:0, Array.from(this.abertos).sort().join(","), this.todosAbertos?1:0,
                   L.map(d=>d.codigo+(Alarmes.ativo(d)===true?"+":Alarmes.ativo(d)===undefined?"?":"-")).join(",")].join("|");
      if (sig !== this.assin) { this.assin = sig; this.desenha(L); }
      this.vivo();
    }
    const n = Alarmes.hist.length;
    $("#alHist tbody").innerHTML = Alarmes.hist.slice().reverse().slice(0,100).map(x=>`<tr><td class="num">${new Date(x.t).toLocaleString("pt-BR",{hour12:false})}</td><td><b>${esc(x.ev)}</b></td><td><span class="cod">${esc(x.cod||"")}</span></td><td>${esc(x.txt)}</td><td>${esc(x.dados||"")}</td><td class="num">${esc(x.dur)}</td></tr>`).join("")
      || '<tr><td colspan="6" style="color:var(--muted)">Sem eventos registrados.</td></tr>';
  },
  /* ---------- exportar ---------- */
  relatorio(md){
    const ativos = Alarmes.ativos().sort((a,b)=>this.ORD[a.tipo]-this.ORD[b.tipo]||a.codigo.localeCompare(b.codigo));
    const origem = Dados.estado && Dados.estado.origem==="demo" ? "DADOS SIMULADOS" : "PLC";
    const L = []; const h = (t,n)=>md ? "#".repeat(n)+" "+t : t.toUpperCase();
    L.push(h("Baggio — Alertas e falhas ativos",1)); L.push("Gerado em "+new Date().toLocaleString("pt-BR",{hour12:false})+" · dados: "+origem); L.push("");
    if (!ativos.length) L.push("Nenhum alarme ativo.");
    ativos.forEach(d=>{ const e = Alarmes.estado[d.codigo];
      L.push(h(d.codigo+" · "+this.NOME[d.tipo]+" · "+d.nome,2)); L.push("Ativo desde "+(e?hhmmss(e.desde):"?")+" · endereço "+d.bit);
      L.push((md?"- ":"")+"Efeito: "+d.efeito); L.push((md?"- ":"")+"Como o PLC decide: "+d.gatilho);
      if (d.obs) L.push((md?"- ":"")+"Observação do programa: "+d.obs);
      d.causas.forEach((c,i)=>{ L.push((md?"- ":"")+"Causa "+(i+1)+": "+c.t); L.push("    Teste rápido: "+c.teste);
        c.sol.forEach(x=>L.push("    Solução ["+(CAT_ALARMES.onde[x[1]]||x[1])+"]: "+x[0])); });
      L.push(""); });
    L.push("Efeito, causa, teste e solução são texto proposto, a validar com quem opera a máquina.");
    return L.join("\n");
  },
  baixar(nome, txt, tipo){
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([txt],{type:tipo+";charset=utf-8"})); a.download = nome;
    document.body.appendChild(a); a.click(); a.remove();
  },
  exportar(f){
    const carimbo = new Date().toISOString().slice(0,19).replace(/[:T]/g,"-");
    if (f==="txt") this.baixar("baggio_alertas_"+carimbo+".txt", "﻿"+this.relatorio(false), "text/plain");
    else if (f==="md") this.baixar("baggio_alertas_"+carimbo+".md", "﻿"+this.relatorio(true), "text/markdown");
    else if (f==="csv") { const linhas = [["hora","evento","codigo","alarme","endereco","dados","duracao"]].concat(Alarmes.hist.map(x=>[new Date(x.t).toLocaleString("pt-BR",{hour12:false}),x.ev,x.cod||"",x.txt,x.end||"",x.dados||"",x.dur]));
      this.baixar("baggio_historico_"+carimbo+".csv", "﻿"+linhas.map(l=>l.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(";")).join("\r\n"), "text/csv"); }
    else if (f==="pdf") { this.todosAbertos = true; this.assin=""; renderTudo(); setTimeout(()=>window.print(), 60); }
  }
};

/* ============================================================
   7. ENTRADAS E SAIDAS
   ============================================================ */
const TelaES = {
  area:"I", montadoAnalog:false,
  filtrar(t){
    const busca = $("#esBusca").value.trim().toLowerCase();
    if (t.classe==="reserva" && !$("#esRes").checked) return false;
    if ($("#esAtivos").checked && Dados.bit(t.endereco)!==true) return false;
    if (busca && !(t.endereco.toLowerCase().includes(busca) || (t.comentario||"").toLowerCase().includes(busca) || t.nome.toLowerCase().includes(busca))) return false;
    return true;
  },
  atualizar(){
    if (!Dados.contrato) return;
    const tags = Dados.contrato.tags.filter(t=>t.area===this.area && t.classe!=="alarme" && t.classe!=="estado");
    const grupos = {};
    tags.filter(t=>this.filtrar(t)).forEach(t=>{ (grupos[t.byte]=grupos[t.byte]||[]).push(t); });
    const bytes = Object.keys(grupos).sort((a,b)=>parseInt(a.slice(2))-parseInt(b.slice(2)));
    let n=0, ativos=0;
    $("#esGrade").innerHTML = bytes.map(b=>{
      const linhas = grupos[b].sort((x,y)=>x.nbit-y.nbit).map(t=>{
        const v = Dados.bit(t.endereco); n++; if (v) ativos++;
        const desc = t.comentario || t.nome;
        const alerta = t.nome.endsWith("_res") && t.classe!=="reserva" ? ' <span class="warn" title="Nome da tag diz reserva, mas o comentário descreve uma função (pendência P-01/P-02)">⚠</span>' : "";
        return `<div class="bit ${v===undefined?"nd":v?"on":""}"><span class="dot ${v===undefined?"nd":v?"on-g":""}"></span>
          <span class="a">${esc(t.endereco)}</span><span class="d" title="${esc(t.nome)}">${esc(desc)}${alerta}</span>
          <span class="e">${v===undefined?"—":v?"1":"0"}</span></div>`;}).join("");
      return `<div class="byte"><h4>${this.area}${parseInt(b.slice(2))} — byte ${parseInt(b.slice(2))}</h4>${linhas}</div>`;
    }).join("") || '<div class="vazio" style="color:var(--muted);grid-column:1/-1">Nenhum item com este filtro</div>';
    $("#esCont").textContent = n+" itens · "+ativos+" ativos";
    if (!this.montadoAnalog) {
      $("#esAnalog").innerHTML = '<p class="rot" style="margin:0 0 6px">Não lidas na v0.1 (endereços de periferia; escala e unidade pendentes — P-03).</p>' +
        Dados.contrato.analogicas.map(a=>`<div class="bit nd"><span class="a" style="width:60px">${esc(a.endereco)}</span><span class="d">${esc(a.comentario||a.nome)}<small>${esc(a.nome)}</small></span><span class="e" style="width:auto">não lido</span></div>`).join("");
      this.montadoAnalog = true;
    }
  }
};

/* ============================================================
   8. CABECALHO, FAIXA, ABAS E POPOVERS
   ============================================================ */
const Textos = {
  ov:["Overview","<p>Mesma disposição da tela do WinCC. <b>Somente leitura</b>: nada aqui envia comando.</p><ul>"
    +"<li>Lâmpada <b>verde</b> = ativo/em operação (no visual moderno com ✓); <b>cinza</b> = inativo/parado; <b>vermelha com !</b> = falha (alarme ou disjuntor do equipamento); <b>tracejada com ?</b> = sem dado.</li>"
    +"<li><b>Toque/clique numa lâmpada ou válvula</b> para ver o estado e o endereço no PLC.</li>"
    +"<li>O selo no topo resume a máquina: Em operação, Aviso, Falha ou Parada.</li>"
    +"<li>Visual <b>Original</b> = tela do WinCC; <b>Moderno</b> = identidade do medidor. Os dados são os mesmos.</li>"
    +"<li><b>Nível dos tanques</b> vem dos sensores de nível (sensor ativo = coberto, a validar na máquina, P-10). Ondas e fluxo nos tubos são ilustrativos; o botão <b>Animação</b> liga e desliga.</li>"
    +"<li><b>Dados</b> (cabeçalho): <b>PLC</b> mostra os dados reais, lidos pelo Node-RED; <b>Simulados</b> mostra dados de teste gerados na própria página, sem PLC nem Node-RED, com selo DEMO.</li>"
    +"<li>Frequência das bombas ainda não é lida (P-03).</li></ul>"],
  al:["Alertas e falhas","<p>Lista dos alarmes do PLC. <b>Toque numa linha</b> para ver: <b>1 · Efeito</b> (o sintoma), <b>2 · Causa</b> (com teste rápido) e <b>3 · Solução</b> (e onde se resolve), mais <b>Como o PLC decide</b>, com os endereços ao vivo.</p>"
    +"<p><b>Código</b> <code>T-AAA-NNN</code>: T = <b>F</b> falha (alarme crítico do PLC), <b>A</b> alerta (alarme permissível) ou <b>I</b> informação (só estado, não conta como alarme); AAA = família (DSJ disjuntor, CMD comando sem retorno, NIV nível, PRS ar, SEG emergência, FLT filtro, PRT partida das bombas, BND banda). O número nunca é reutilizado.</p>"
    +"<p>Os alarmes que o PLC retém só apagam com <b>RESET FALHAS</b> depois que a causa foi resolvida. As horas são as do navegador. O histórico fica neste navegador (últimos 500 eventos).</p>"
    +"<p><b>Texto proposto:</b> efeito, causa, teste e solução foram escritos a partir da lógica do PLC e precisam da validação de quem opera a máquina. Alarmes marcados OUT vêm da planilha de tags e a lógica deles não está nos blocos fornecidos.</p>"],
    es:["Entradas e saídas","<p>Estado ao vivo de cada entrada (I) e saída (Q) da CPU, agrupado por byte. Reservas ficam ocultas por padrão.</p><p>⚠ marca tag cujo <b>nome diz reserva</b> mas o comentário descreve uma função (pendência P-01/P-02).</p>"]
};
const Cab = {
  /* prioridade: sem dado > falha > aviso > em operacao > parada */
  estado(){
    const f = Mapa.faixa, b = a=>Dados.bit(a);
    if (!Dados.contrato || !Dados.estado || Dados.semCom) return {k:"nd", t:"Sem dado", dica:"Sem leitura atual da CPU"};
    const sirene = b(f.sirene)===true ? " Sirene ligada." : "";
    const grave = Alarmes.ativos().some(d=>d.tipo==="F");
    if (b(f.vermelha)===true || grave) return {k:"bad", t:"■ Falha", dica:"Coluna vermelha / alarme crítico ativo."+sirene};
    if (b(f.amarela)===true || b(f.permissivel)===true) return {k:"warn", t:"▲ Aviso", dica:"Coluna amarela / alarme permissível ativo."+sirene};
    if (b(f.verde)===true) return {k:"run", t:"● Em operação", dica:"Coluna verde: sistema de filtragem ligado."+sirene};
    return {k:"off", t:"○ Parada", dica:"Nenhuma coluna acesa."+sirene};
  },
  atualizar(){
    const o = Dados.estado ? Dados.estado.origem : null;
    const po = $("#pOrigem");
    po.className = "pill "+(o==="demo"?"demo":o==="real"?"real":"com-nd");
    po.textContent = o==="demo" ? "▲ DEMO — DADOS SIMULADOS" : o==="real" ? "PLC real" : "origem ?";
    const pc = $("#pCom");
    if (!Dados.contrato || !Dados.estado) { pc.className="pill com-nd"; pc.textContent = Dados.falhas>=Cfg.falhasParaCair ? "sem Node-RED" : "conectando…"; }
    else if (Dados.semCom) { pc.className="pill com-bad"; pc.textContent="✖ SEM COMUNICAÇÃO"; }
    else { pc.className="pill com-ok"; pc.textContent="✔ comunicação OK"; }
    document.body.classList.toggle("sem-com", Dados.semCom && (Dados.estado!==null || Dados.falhas>=Cfg.falhasParaCair));
    const av = $("#aviso");
    av.innerHTML = "SEM COMUNICAÇÃO — valores apagados"+(Dados.semDesde?" desde "+hhmmss(Dados.semDesde):"")+"<small>"+esc(Dados.motivo||"")+"</small>";
    // estado da maquina: um unico selo (antes eram 4 luzes + "alarme critico")
    const e = Cab.estado(), pe = $("#pEstado");
    pe.className = "pill st-"+e.k; pe.textContent = e.t; pe.title = e.dica;
    // contador
    const n = Alarmes.ativos().length, c = $("#cntAl");
    c.textContent = Dados.semCom ? "?" : n;
    c.className = "cnt"+(!Dados.semCom && n ? (Alarmes.ativos().some(d=>d.tipo==="F")?" ativo":" aviso"):"");
  }
};
/* animacao da agua: ligada/desligada. Padrao: ligada, exceto se o sistema pede menos movimento. */
const Anim = {
  aplicar(on){ document.body.classList.toggle("anim", on); $("#animChk").checked = on; gravarStorage("baggio_anim", on?"1":"0"); },
  iniciar(){
    const salvo = lerStorage("baggio_anim");
    const reduz = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
    this.aplicar(salvo==null ? !reduz : salvo==="1");
    $("#animChk").addEventListener("change", e=>this.aplicar(e.target.checked));
  }
};
/* visual: "mod" (moderno) ou "ori" (original/WinCC). ?tema= na URL tem prioridade; senao o ultimo escolhido; senao moderno. */
const Tema = {
  aplicar(t){
    if (t!=="ori" && t!=="mod") t = "mod";
    document.body.classList.remove("tema-mod","tema-ori"); document.body.classList.add("tema-"+t);
    $$(".vis button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.tema===t));
    gravarStorage("baggio_tema", t);
  },
  iniciar(){
    const q = new URLSearchParams(location.search).get("tema");
    this.aplicar(q || lerStorage("baggio_tema") || "mod");
    $$(".vis button").forEach(b=>b.addEventListener("click",()=>{ this.aplicar(b.dataset.tema); renderTudo(); }));
  }
};
function abrirInfo(chave,btn){ const t = Textos[chave]; abrirPop(t[0], t[1], btn.getBoundingClientRect()); }
function abrirPop(titulo, html, r){
  fecharInfo();
  const p = document.createElement("div");
  p.className="pop"; p.id="pop"; p.setAttribute("role","dialog"); p.setAttribute("aria-label",titulo);
  p.innerHTML = `<button class="fechar" aria-label="Fechar">✕</button><h3>${esc(titulo)}</h3>${html}`;
  document.body.appendChild(p);
  p.style.left = Math.max(8, Math.min(r.left, innerWidth-p.offsetWidth-8))+"px";
  p.style.top = Math.min(r.bottom+6, innerHeight-p.offsetHeight-8)+"px";
  $(".fechar",p).addEventListener("click",fecharInfo); $(".fechar",p).focus();
}
function fecharInfo(){ const p=$("#pop"); if(p) p.remove(); }
function mostrar(v){
  $$("nav button").forEach(b=>b.setAttribute("aria-selected",b.dataset.v===v));
  $$(".vista").forEach(s=>s.classList.toggle("ativa",s.id==="v-"+v));
  gravarStorage("baggio_aba",v); fecharInfo(); renderTudo();
}
function renderTudo(){
  Alarmes.atualizar(); Cab.atualizar();
  const v = $(".vista.ativa").id;
  if (v==="v-ov") Overview.atualizar(); else if (v==="v-al") TelaAlertas.atualizar(); else TelaES.atualizar();
}

/* ============================================================
   9. INICIO
   ============================================================ */
function iniciar(){
  const qs = new URLSearchParams(location.search);
  let base = qs.get("api") || "";
  if (!base && location.protocol==="file:") base = lerStorage("baggio_api") || "";
  // fonte: ?fonte= na URL > ultima escolha > (arquivo aberto direto = simulacao; servido pelo Node-RED = CPU)
  const fonte = qs.get("fonte") || lerStorage("baggio_fonte") || (location.protocol==="file:" ? "sim" : "cpu");
  Dados.fonte = fonte==="sim" ? "sim" : "cpu";
  $$("#fonteSel button").forEach(b=>{ b.setAttribute("aria-pressed", b.dataset.fonte===Dados.fonte); b.addEventListener("click",()=>Dados.trocarFonte(b.dataset.fonte)); });
  if (!base && location.protocol==="file:" && Dados.fonte==="cpu") {
    $("#conf").style.display="block";
    $("#confOk").addEventListener("click",()=>{ const u=$("#confUrl").value.trim().replace(/\/+$/,""); if(u){ gravarStorage("baggio_api",u); location.reload(); } });
  }
  Dados.base = base.replace(/\/+$/,"");
  $$("nav button").forEach(b=>b.addEventListener("click",()=>mostrar(b.dataset.v)));
  $$("[data-info]").forEach(b=>b.addEventListener("click",e=>{ e.stopPropagation(); abrirInfo(b.dataset.info,b); }));
  document.addEventListener("click",e=>{ if(!e.target.closest(".pop")) fecharInfo(); });
  document.addEventListener("keydown",e=>{ if(e.key==="Escape") fecharInfo(); });
  TelaAlertas.iniciar();
  $$(".sub button").forEach(b=>b.addEventListener("click",()=>{ TelaES.area=b.dataset.area; $$(".sub button").forEach(x=>x.setAttribute("aria-pressed",x===b)); renderTudo(); }));
  ["esBusca","esAtivos","esRes"].forEach(id=>$("#"+id).addEventListener("input",renderTudo));
  setInterval(()=>{ $("#relogio").textContent = new Date().toLocaleString("pt-BR",{hour12:false}); }, 1000);
  Tema.iniciar(); Anim.iniciar();
  Dados.aoAtualizar(renderTudo);
  const aba = lerStorage("baggio_aba"); if (aba && $("#v-"+aba)) { $$("nav button").forEach(b=>b.setAttribute("aria-selected",b.dataset.v===aba)); $$(".vista").forEach(s=>s.classList.toggle("ativa",s.id==="v-"+aba)); }
  if (Dados.base || location.protocol!=="file:" || Dados.fonte==="sim") Dados.iniciar();
  renderTudo();
}
window.Baggio = {Dados, Mapa, Alarmes, Overview, Anim, VERSAO};   // acesso para os testes
iniciar();
</script>
